<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Revisión responsive de prototipos</title><style>body{margin:0;padding:24px;font:15px system-ui;background:#F5F4F7;color:#4D4653}a{color:#087577}label{display:block;margin:20px 0}select{padding:12px;font:inherit}.frames{display:flex;gap:24px;align-items:start;flex-wrap:wrap}iframe{border:1px solid #ccc;background:white;display:block;flex-shrink:0}h1{font-size:28px}p{max-width:850px;line-height:1.6}figure{margin:0}figcaption{padding:12px 0;font-weight:bold}</style></head><body><a href="index.html">Volver a propuestas</a><h1>Revisión responsive</h1><p>Marcos HTML con viewport CSS propio. No representan una prueba en dispositivo físico ni modifican el ancho del navegador exterior. Usa el scroll dentro de cada marco para recorrer el contenido.</p><label>Prototipo <select id="page"><option value="headhunting.html">Headhunting</option><option value="personalizado.html">Servicio personalizado</option><option value="servicios.html">Servicios</option><option value="contacto.html">Contacto</option><option value="operativo.html">Reclutamiento de personal operativo</option><option value="headhunting-cdmx.html">Headhunting en CDMX</option></select></label><p id="metrics" aria-live="polite">Esperando medidas reales de los marcos…</p><div class="frames"><figure><figcaption>390 × 844 CSS px</figcaption><iframe id="mobile" title="Prototipo a 390 píxeles" width="390" height="844" src="headhunting.html"></iframe></figure><figure><figcaption>768 × 1024 CSS px</figcaption><iframe id="tablet" title="Prototipo a 768 píxeles" width="768" height="1024" src="headhunting.html"></iframe></figure></div><script>document.getElementById("page").addEventListener("change",e=>{document.getElementById("mobile").src=e.target.value;document.getElementById("tablet").src=e.target.value;});function measureFrames(){document.getElementById("metrics").textContent=["mobile","tablet"].map(id=>{const f=document.getElementById(id),w=f.contentWindow,d=f.contentDocument;return id+": "+w.location.pathname.split("/").pop()+" innerWidth="+w.innerWidth+", innerHeight="+w.innerHeight+", documentWidth="+d.documentElement.scrollWidth+", H1="+d.querySelectorAll("h1").length+", formularios="+d.querySelectorAll("form").length;}).join(" — ");}document.querySelectorAll("iframe").forEach(f=>f.addEventListener("load",measureFrames));window.addEventListener("load",measureFrames);</script></body></html>
